budget: 100
repeat: 5
output_dir: benchmark_results

# Benchmark mode. Run the unconstrained and constrained suites as SEPARATE
# experiments so constrained problems are never mixed with unconstrained ones:
#   python benchmark_best_codes.py                                                # unconstrained
#   python benchmark_best_codes.py constrained=true constrained_suite=synthetic   # pymoo ctp/bnh/c3dtlz4
#   python benchmark_best_codes.py constrained=true constrained_suite=real        # CRE engineering problems
#   python benchmark_best_codes.py constrained=true constrained_suite=both        # synthetic + real
# Override output_dir per experiment to keep the CSVs/figures apart, e.g.
#   python benchmark_best_codes.py constrained=true constrained_suite=real output_dir=benchmark_results_constrained_real
constrained: false
constrained_suite: synthetic  # synthetic | real | both (only used when constrained=true)

plotting:
  save_figures: true
  show_figures: false
  convergence_dpi: 150
  pareto_dpi: 300

# Export raw objective / Pareto-front data to CSV so Pareto figures can be
# regenerated from data (e.g. via plot_from_csv.py), like the HV curves.
export:
  objectives: true   # objectives_log.csv: Algorithm, Problem, Repeat, Eval, f1..fM
  pareto: true       # pareto_front_log.csv: Algorithm, Problem, PointIdx, f1..fM

# =========================== UNCONSTRAINED ===========================
# Used when constrained=false. Unconstrained problems only -- constrained
# problems live in constrained_problems below, never here.
problems:
  - { name: zdt1, dim: 30, n_obj: 2, ref_point: [ 1.1, 6.0 ] }
  - { name: zdt4, dim: 10, n_obj: 2, ref_point: [ 1.1, 160.0 ] }

algorithms:
  - path: "exp_mo_paper/ESPopulation_evol_1+1_0331113806/28-29_MOBOParEGOEI_0.5432.py"
    cls_name: MOBOParEGOEI
    handler_pkl: "exp_mo_paper/ESPopulation_evol_1+1_0331113806/28-29_MOBOParEGOEI_0.5432_handler.pkl"

  - path: "exp_mo_es_search/ESPopulation_evol_4+16_0121124246/4-56_MOBOForestTchebyUCB_-4917.5413.py"
    cls_name: MOBOForestTchebyUCB

  - path: "MO bench/NSGA-II.py"
    cls_name: NSGA2Wrapper

  - path: "MO bench/MORS_baseline.py"
    cls_name: RandomSearchMO

  # State-of-the-art Bayesian baselines via BOFire (external, trusted MOBO
  # framework wrapping BoTorch) instead of in-house wrappers.
  - path: "MO bench/bofire_baseline.py"
    cls_name: BoFireQparEGOWrapper

  - path: "MO bench/bofire_baseline.py"
    cls_name: BoFireQLogNEHVIWrapper

# ============================ CONSTRAINED ============================
# Used when constrained=true. SEEN are the 9 problems LLaMEA-MOO trained on
# (conf/config.yaml mo_search.constrained_problems, identical ref points).
# HELD-OUT are unseen constrained problems for generalization, including tight
# (tnk, mw*) and negative-objective (osy) ones that are benchmark-only. All
# return the constrained (F, G) contract, so only constraint-aware algorithms
# belong in constrained_algorithms.
constrained_problems:
  # --- seen (training suite) ---
  - { name: "bnh",     dim: 2,  n_obj: 2, ref_point: [ 150.0, 55.0 ] }
  - { name: "ctp1",    dim: 5,  n_obj: 2, ref_point: [ 1.1, 5.0 ] }
  - { name: "ctp2",    dim: 5,  n_obj: 2, ref_point: [ 1.1, 5.0 ] }
  - { name: "ctp3",    dim: 5,  n_obj: 2, ref_point: [ 1.1, 5.0 ] }
  - { name: "ctp4",    dim: 5,  n_obj: 2, ref_point: [ 1.1, 5.0 ] }
  - { name: "ctp5",    dim: 5,  n_obj: 2, ref_point: [ 1.1, 5.0 ] }
  - { name: "ctp6",    dim: 5,  n_obj: 2, ref_point: [ 1.1, 80.0 ] }
  - { name: "ctp7",    dim: 5,  n_obj: 2, ref_point: [ 1.1, 5.0 ] }
  - { name: "c3dtlz4", dim: 12, n_obj: 3, ref_point: [ 3.0, 2.5, 2.8 ] }
  # --- held-out (unseen) ---
  - { name: "ctp8",    dim: 5,  n_obj: 2, ref_point: [ 1.1, 80.0 ] }
  - { name: "tnk",     dim: 2,  n_obj: 2, ref_point: [ 2.0, 2.0 ] }
  - { name: "osy",     dim: 6,  n_obj: 2, ref_point: [ 0.0, 386.0 ] }  # negative f1, benchmark-only
  - { name: "mw1",     dim: 8,  n_obj: 2, ref_point: [ 1.0, 7.0 ] }
  - { name: "mw2",     dim: 6,  n_obj: 2, ref_point: [ 1.0, 7.0 ] }
  - { name: "mw3",     dim: 6,  n_obj: 2, ref_point: [ 1.0, 7.0 ] }
  - { name: "mw11",    dim: 6,  n_obj: 2, ref_point: [ 30.0, 30.0 ] }

# Real-world constrained suite (CRE, Tanabe & Ishibuchi 2020), served locally
# from llamevol/evaluator/re_problems.py. dim is FIXED per problem (not tunable).
# Ref points = feasible-nadir + margin from a 50k random-sample scan; for the
# tight cre21 (0% random-feasible) the ref point is the overall objective max,
# which still dominates the feasible front. Feasibility rates (random):
# cre21 ~0% (tight), cre22 35%, cre23 65%, cre24 0.4% (tight), cre25 7%,
# cre31 18%, cre51 92%. cre32 is omitted: it has a NEGATIVE objective (f1),
# which breaks the HV/prod(ref) normalization (like osy/srn) -- add it back
# only if you analyze its per-problem HV separately, not the mean.
constrained_re_problems:
  - { name: "cre21", dim: 3, n_obj: 2, ref_point: [ 850.0, 8000.0 ] }     # tight (~0% feasible)
  - { name: "cre22", dim: 4, n_obj: 2, ref_point: [ 310.0, 0.08 ] }
  - { name: "cre23", dim: 4, n_obj: 2, ref_point: [ 9.0, 9.0 ] }
  - { name: "cre24", dim: 7, n_obj: 2, ref_point: [ 6500.0, 1450.0 ] }    # tight (~0.4% feasible)
  - { name: "cre25", dim: 4, n_obj: 2, ref_point: [ 4.0, 66.0 ] }
  - { name: "cre31", dim: 7, n_obj: 3, ref_point: [ 43.0, 4.3, 14.0 ] }
  - { name: "cre51", dim: 3, n_obj: 5, ref_point: [ 85000.0, 1400.0, 2900000.0, 16000000.0, 28000.0 ] }
  # - { name: "cre32", dim: 6, n_obj: 3, ref_point: [ -300.0, 13000.0, 26000.0 ] }  # negative f1; analyze per-problem only

constrained_algorithms:
  # Constraint-aware baselines.
  - path: "MO bench/NSGA-II.py"
    cls_name: NSGA2Wrapper

  # NSGA-III (reference-direction based) -- better suited to the 3-obj
  # (c3dtlz4, cre31) and 5-obj (cre51) problems than NSGA-II.
  - path: "MO bench/NSGA-III.py"
    cls_name: NSGA3Wrapper

  - path: "MO bench/ioc_samo_cobra.py"
    cls_name: IOCSAMOCOBRAWrapper

  - path: "MO bench/MORS_baseline.py"
    cls_name: RandomSearchMO

  # Constrained SOTA Bayesian baseline: BOFire qLogNEHVI MOBO with output
  # constraints (the constrained successor to qParEGO). Auto-detects the
  # constrained func(x) -> (F, G) contract and activates constraint handling
  # once the constraint-aware data layer feeds G.
  - path: "MO bench/bofire_baseline.py"
    cls_name: BoFireConstrainedQLogNEHVIWrapper

  # Best LLaMEA-MOO constrained algorithm -- fill in after the constrained runs,
  # e.g.:
  # - path: "exp_mo_constrained_run1/ESPopulation_.../X-Y_<Algo>_<score>.py"
  #   cls_name: <Algo>
  #   handler_pkl: "exp_mo_constrained_run1/ESPopulation_.../X-Y_<Algo>_<score>_handler.pkl"
