# Phase 3, five more runs of every method (GECCO revision): repeats 6-10
#
# The paper's per-problem tests need more than five runs: with 5 against 5, the
# smallest two-sided Mann-Whitney p is 2/252 = 0.0079, which no Holm correction over
# more than six comparisons can pass. These runs add five independent repeats of every
# method of conf/benchmark_phase3.yaml, plus qEHVI, under the same controls as the qEHVI runs:
# one thread per run, a 10 h per-run limit, and max_workers parallel runs.
# The runs are unseeded, as in conf/benchmark_phase3.yaml; this folder labels them
# repeats 1-5, and the analysis counts them as repeats 6-10.
# Improved-Scalarized-EI is absent here as in conf/benchmark_phase3.yaml; its repeats 6-10 come from
#     python paper_reproduction/rerun_isei_seeds.py --seeds 5 6 7 8 9 --first-repeat 6 ...
# and DDMTOLab's MOEA/D-EGO and ParEGO from the ablation runner's baseline stage on
# seeds 6-10 (see README, "Five more runs").
#
# Run from the repo root:
#     python benchmark_best_codes.py config=conf/benchmark_extra_phase3.yaml
budget: 400
repeat: 5
output_dir: benchmark_results/extra_phase3
timeout: 360000        # one algorithm's whole evaluation (100 h)
run_timeout: 36000     # 10 h per run, as for qEHVI
max_workers: 3          # the other 5 cores run phase 2's extra runs
threads_per_run: 1
start_method: spawn     # fresh random state per worker; Linux forks by default, and forked
                        # workers repeat each other's unseeded runs
constrained: false
constrained_suite: synthetic

plotting:
  save_figures: false
  show_figures: false
  convergence_dpi: 150
  pareto_dpi: 300

export:
  objectives: false   # ~16 MB per stage and unused by every paper figure/table
  pareto: true

problems:
  - { name: re21, dim: 4, n_obj: 2, ref_point: [2851.9, 0.037] }
  - { name: re34, dim: 5, n_obj: 3, ref_point: [1862.3, 12.17, 0.196] }
  - { name: re37, dim: 4, n_obj: 3, ref_point: [0.887, 0.913, 1.012] }

algorithms:
  # NOTE: Improved-Scalarized-EI is deliberately ABSENT from this config.
  # It is the only one of the nine generated algorithms with a `random_seed`
  # parameter (default 42) feeding its own np.random.default_rng, so it is
  # deterministic: every repeat returns an identical hypervolume. The paper's
  # Improved-Scalarized-EI rows come from five explicit seeds instead, produced by
  #     python paper_reproduction/rerun_isei_seeds.py
  # (here with --seeds 5 6 7 8 9; see the header).


  # (4+16)-ES  exp_mo_4plus16_run3  generation 3, offspring #52  (search fitness 0.5295)
  - path: "generated_algorithms/MOBORandomForestLCBPBI_CD.py"
    cls_name: MOBORandomForestLCBPBI_CD
    init_kwargs:
      kappa_cd: 0.0020236454844
      kappa_ucb: 0.0250571872575
      model_window_size: 99
      n_candidates_acquisition: 195
      n_weights_acquisition: 41
      pbi_theta: 5.5866193904791
      rf_n_estimators: 53

  # (4+16)-ES  exp_mo_4plus16_run1  generation 6, offspring #92  (search fitness 0.5158)
  - path: "generated_algorithms/MOBORandomForestParEGO_Batch_Refined.py"
    cls_name: MOBORandomForestParEGO_Batch_Refined
    init_kwargs:
      batch_size: 4
      exploration_beta: 0.1017420629503
      max_features: 0.75
      min_samples_leaf: 2
      n_candidates: 133
      n_estimators: 10
      sliding_window_size: 130

  # development-found generated algorithm; LLM default hyperparameters (its SMAC HPO crashed during generation)
  - path: "MO bench/MOBO_MOEAD_EI_Hybrid_fixed.py"
    cls_name: MOBO_MOEAD_EI_Hybrid_Fixed
    init_kwargs:
      # SMAC incumbent for MOEAD-EI Hybrid, from paper_results/moead_hpo/incumbent.json.
      # Table II reports the TUNED configuration (0.971 synthetic / 0.926 real-world);
      # omitting these gives the LLM defaults, i.e. the Table III "default" column
      # (0.956 / 0.859).
      batch_size: 6
      kernel_nu: 0.5
      n_init_ratio: 0.275
      n_model_points: 200
      n_offspring_surrogate: 250
      population_size: 60
      rho: 0.01

  # SOTA Bayesian baseline (BoFire QparegoStrategy, on BoTorch)
  - path: "MO bench/bofire_baseline.py"
    cls_name: BoFireQparEGOWrapper

  # surrogate-assisted baseline
  - path: "MO bench/ioc_samo_cobra.py"
    cls_name: IOCSAMOCOBRAWrapper

  # classical evolutionary baseline
  - path: "MO bench/NSGA-II.py"
    cls_name: NSGA2Wrapper

  # classical evolutionary baseline (reference-direction based)
  - path: "MO bench/NSGA-III.py"
    cls_name: NSGA3Wrapper

  # multi-objective Random Search (lower bound)
  - path: "MO bench/MORS_baseline.py"
    cls_name: RandomSearchMO

  # qEHVI (BoFire MoboStrategy defaults, one candidate per iteration), as in
  # conf/benchmark_qehvi_phase3.yaml
  - path: "MO bench/bofire_baseline.py"
    cls_name: BoFireQEHVIWrapper
