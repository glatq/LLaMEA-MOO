# Phase 2 -- top three generated algorithms + MOEAD-EI Hybrid vs five baselines
#
# Reproduces paper_data/benchmark_stage2 (Table II synthetic column, Fig. 4, Fig. 6a,
# Fig. 7, supplementary Figs. 9 and 10, and supplementary Tables I-II).
# Problems, dimensions and reference points are exactly Table I of the paper.
# Budget 400 evaluations, 5 independent repeats, as in Section V-B.
#
# Run from the repo root:
#     python benchmark_best_codes.py config=conf/benchmark_phase2.yaml
# Any field can be overridden on the command line, e.g. `repeat=1 budget=100`.
#
# `timeout` is the wall-clock cap for ONE algorithm across all problem x repeat
# tasks, which run in a process pool sized to os.cpu_count(). 21600 s (6 h) is the
# value used for the reported runs, on a many-core machine; raise it on a smaller
# host or qParEGO (~3 h per run on the synthetic suite) will be cut short.
budget: 400
repeat: 5
output_dir: benchmark_results/phase2
timeout: 21600
constrained: false
constrained_suite: synthetic

plotting:
  save_figures: false
  show_figures: false
  convergence_dpi: 150
  pareto_dpi: 300

export:
  objectives: false   # ~16 MB per stage and unused by every paper figure/table
  pareto: true

problems:
  - { name: zdt1, dim: 30, n_obj: 2, ref_point: [1.1, 7.2] }
  - { name: zdt2, dim: 30, n_obj: 2, ref_point: [1.1, 8.0] }
  - { name: zdt3, dim: 30, n_obj: 2, ref_point: [1.1, 7.2] }
  - { name: zdt4, dim: 10, n_obj: 2, ref_point: [1.1, 300.0] }
  - { name: zdt6, dim: 10, n_obj: 2, ref_point: [1.1, 11.0] }
  - { name: dtlz1, dim: 5, n_obj: 3, ref_point: [10.0, 10.0, 10.0] }
  - { name: dtlz2, dim: 20, n_obj: 3, ref_point: [3.0, 3.0, 3.0] }
  - { name: dtlz4, dim: 5, n_obj: 3, ref_point: [1.1, 1.1, 1.1] }
  - { name: dtlz7, dim: 20, n_obj: 3, ref_point: [1.1, 1.1, 28.0] }
  - { name: wfg4, dim: 6, n_obj: 2, ref_point: [2.2, 4.4] }
  - { name: wfg7, dim: 10, n_obj: 3, ref_point: [2.2, 4.4, 6.6] }
  - { name: wfg9, dim: 6, n_obj: 2, ref_point: [2.2, 4.4] }

algorithms:
  # NOTE: Improved-Scalarized-EI is deliberately ABSENT from this config.
  # It is the only one of the nine generated algorithms with a `random_seed`
  # parameter (default 42) feeding its own np.random.default_rng, so it is
  # deterministic: every repeat returns an identical hypervolume. The paper's
  # Improved-Scalarized-EI rows come from five explicit seeds instead, produced by
  #     python paper_reproduction/rerun_isei_seeds.py
  # which also appends its rows into this config's output_dir. Running it here with
  # repeat=5 would waste ~1.5 h and report zero variance. See Section VI-B of the paper.


  # (4+16)-ES  exp_mo_4plus16_run3  generation 3, offspring #52  (search fitness 0.5295)
  - path: "generated_algorithms/MOBORandomForestLCBPBI_CD.py"
    cls_name: MOBORandomForestLCBPBI_CD
    init_kwargs:
      kappa_cd: 0.0020236454844
      kappa_ucb: 0.0250571872575
      model_window_size: 99
      n_candidates_acquisition: 195
      n_weights_acquisition: 41
      pbi_theta: 5.5866193904791
      rf_n_estimators: 53

  # (4+16)-ES  exp_mo_4plus16_run1  generation 6, offspring #92  (search fitness 0.5158)
  - path: "generated_algorithms/MOBORandomForestParEGO_Batch_Refined.py"
    cls_name: MOBORandomForestParEGO_Batch_Refined
    init_kwargs:
      batch_size: 4
      exploration_beta: 0.1017420629503
      max_features: 0.75
      min_samples_leaf: 2
      n_candidates: 133
      n_estimators: 10
      sliding_window_size: 130

  # development-found generated algorithm; LLM default hyperparameters (its SMAC HPO crashed during generation)
  - path: "MO bench/MOBO_MOEAD_EI_Hybrid_fixed.py"
    cls_name: MOBO_MOEAD_EI_Hybrid_Fixed
    init_kwargs:
      # SMAC incumbent for MOEAD-EI Hybrid, from paper_results/moead_hpo/incumbent.json.
      # Table II reports the TUNED configuration (0.971 synthetic / 0.926 real-world);
      # omitting these gives the LLM defaults, i.e. the Table III "default" column
      # (0.956 / 0.859).
      batch_size: 6
      kernel_nu: 0.5
      n_init_ratio: 0.275
      n_model_points: 200
      n_offspring_surrogate: 250
      population_size: 60
      rho: 0.01

  # SOTA Bayesian baseline (BoFire QparegoStrategy, on BoTorch)
  - path: "MO bench/bofire_baseline.py"
    cls_name: BoFireQparEGOWrapper

  # surrogate-assisted baseline
  - path: "MO bench/ioc_samo_cobra.py"
    cls_name: IOCSAMOCOBRAWrapper

  # classical evolutionary baseline
  - path: "MO bench/NSGA-II.py"
    cls_name: NSGA2Wrapper

  # classical evolutionary baseline (reference-direction based)
  - path: "MO bench/NSGA-III.py"
    cls_name: NSGA3Wrapper

  # multi-objective Random Search (lower bound)
  - path: "MO bench/MORS_baseline.py"
    cls_name: RandomSearchMO
