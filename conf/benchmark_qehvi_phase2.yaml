# Phase 2 add-on -- the BOFire qEHVI baseline on the 12 synthetic problems
#
# Adds qEHVI (BOFire MoboStrategy, default settings) to paper_data/benchmark_stage2.
# Problems, dimensions, reference points, budget and repeats are exactly those of
# conf/benchmark_phase2.yaml, so the results can be merged with that stage.
#
# Run from the repo root:
#     python benchmark_best_codes.py config=conf/benchmark_qehvi_phase2.yaml
#
# Run controls (written to <output_dir>/environment.json):
#   max_workers      parallel runs; null = one per physical core
#   threads_per_run  thread cap for BLAS/OpenMP/torch inside each run
#   run_timeout      per-run wall-clock limit (s). A run that reaches it stops,
#                    keeps the evaluations it made and is flagged TimedOut in
#                    run_status_log.csv. 36000 s = 10 h: every Phase 2/3 run of
#                    the other methods finished within it (the longest, qNParEGO
#                    on DTLZ4, took 9.0 h). The first qEHVI pass used 21600 s
#                    (6 h); its stopped DTLZ4 runs are redone with the 10 h limit
#                    by conf/benchmark_qehvi_rerun.yaml.
#   timeout          cap for the whole stage (all problems x repeats), set well
#                    above run_timeout so it never cuts runs short.
budget: 400
repeat: 5
output_dir: benchmark_results/phase2_qehvi
timeout: 259200
run_timeout: 36000
max_workers: null
threads_per_run: 1
constrained: false
constrained_suite: synthetic

plotting:
  save_figures: false
  show_figures: false
  convergence_dpi: 150
  pareto_dpi: 300

export:
  objectives: false
  pareto: true

problems:
  - { name: zdt1, dim: 30, n_obj: 2, ref_point: [1.1, 7.2] }
  - { name: zdt2, dim: 30, n_obj: 2, ref_point: [1.1, 8.0] }
  - { name: zdt3, dim: 30, n_obj: 2, ref_point: [1.1, 7.2] }
  - { name: zdt4, dim: 10, n_obj: 2, ref_point: [1.1, 300.0] }
  - { name: zdt6, dim: 10, n_obj: 2, ref_point: [1.1, 11.0] }
  - { name: dtlz1, dim: 5, n_obj: 3, ref_point: [10.0, 10.0, 10.0] }
  - { name: dtlz2, dim: 20, n_obj: 3, ref_point: [3.0, 3.0, 3.0] }
  - { name: dtlz4, dim: 5, n_obj: 3, ref_point: [1.1, 1.1, 1.1] }
  - { name: dtlz7, dim: 20, n_obj: 3, ref_point: [1.1, 1.1, 28.0] }
  - { name: wfg4, dim: 6, n_obj: 2, ref_point: [2.2, 4.4] }
  - { name: wfg7, dim: 10, n_obj: 3, ref_point: [2.2, 4.4, 6.6] }
  - { name: wfg9, dim: 6, n_obj: 2, ref_point: [2.2, 4.4] }

algorithms:
  # SOTA hypervolume-based Bayesian baseline (BOFire MoboStrategy + qEHVI, on
  # BoTorch), with BOFire's default settings like the qNParEGO baseline.
  - path: "MO bench/bofire_baseline.py"
    cls_name: BoFireQEHVIWrapper
