# Timing pass, Phase 3 -- run time of every Phase 3 algorithm under controlled conditions
#
# One run per algorithm and problem (the 3 real-world RE problems), only to measure wall-clock
# time. The hypervolume results of the paper stay those of conf/benchmark_phase3.yaml
# (5 repeats); this pass replaces only the run times, which the original runs measured
# with a pool sized to os.cpu_count() and no thread cap on torch.
#
# Run from the repo root (after any other benchmark on the machine has finished, so
# the timings are not disturbed):
#     python benchmark_best_codes.py config=conf/benchmark_timing_phase3.yaml
#
# Run controls (written to <output_dir>/environment.json): one run per physical core,
# one thread per run (BLAS, OpenMP and torch), and no per-run time limit, because a
# run that is cut short has no meaningful run time. Each algorithm is timed in its own
# pass over the problems, as in the main benchmark.
budget: 400
repeat: 1
output_dir: benchmark_results/timing_phase3
timeout: 172800
run_timeout: null
max_workers: null
threads_per_run: 1
constrained: false
constrained_suite: synthetic

plotting:
  save_figures: false
  show_figures: false
  convergence_dpi: 150
  pareto_dpi: 300

export:
  objectives: false
  pareto: false

problems:
  - { name: re21, dim: 4, n_obj: 2, ref_point: [2851.9, 0.037] }
  - { name: re34, dim: 5, n_obj: 3, ref_point: [1862.3, 12.17, 0.196] }
  - { name: re37, dim: 4, n_obj: 3, ref_point: [0.887, 0.913, 1.012] }

algorithms:
  # (4+16)-ES  exp_mo_4plus16_run3  generation 3, offspring #52  (search fitness 0.5295)
  - path: "generated_algorithms/MOBORandomForestLCBPBI_CD.py"
    cls_name: MOBORandomForestLCBPBI_CD
    init_kwargs:
      kappa_cd: 0.0020236454844
      kappa_ucb: 0.0250571872575
      model_window_size: 99
      n_candidates_acquisition: 195
      n_weights_acquisition: 41
      pbi_theta: 5.5866193904791
      rf_n_estimators: 53

  # (4+16)-ES  exp_mo_4plus16_run1  generation 6, offspring #92  (search fitness 0.5158)
  - path: "generated_algorithms/MOBORandomForestParEGO_Batch_Refined.py"
    cls_name: MOBORandomForestParEGO_Batch_Refined
    init_kwargs:
      batch_size: 4
      exploration_beta: 0.1017420629503
      max_features: 0.75
      min_samples_leaf: 2
      n_candidates: 133
      n_estimators: 10
      sliding_window_size: 130

  # (4+16)-ES  exp_mo_4plus16_run2  generation 4, offspring #58  (search fitness 0.6981)
  # SMAC incumbent from generated_algorithms/incumbents.yaml plus the first of the
  # five seeds of paper_reproduction/rerun_isei_seeds.py (one run per problem here).
  - path: "generated_algorithms/MOBOImprovedScalarizedEI.py"
    cls_name: MOBOImprovedScalarizedEI
    init_kwargs:
      ea_crossover_rate: 0.8069829779829
      ea_generations: 39
      ea_mutation_rate: 0.4022169454306
      ea_pop_size: 85
      gp_restarts_optimizer: 1
      model_window_size: 91
      n_uniform_weights: 48
      random_seed: 42

  # development-found generated algorithm, SMAC-tuned configuration (Table II)
  - path: "MO bench/MOBO_MOEAD_EI_Hybrid_fixed.py"
    cls_name: MOBO_MOEAD_EI_Hybrid_Fixed
    init_kwargs:
      batch_size: 6
      kernel_nu: 0.5
      n_init_ratio: 0.275
      n_model_points: 200
      n_offspring_surrogate: 250
      population_size: 60
      rho: 0.01

  # SOTA Bayesian baseline: BoFire QparegoStrategy with its defaults (qNParEGO)
  - path: "MO bench/bofire_baseline.py"
    cls_name: BoFireQparEGOWrapper

  # surrogate-assisted baseline
  - path: "MO bench/ioc_samo_cobra.py"
    cls_name: IOCSAMOCOBRAWrapper

  # classical evolutionary baseline
  - path: "MO bench/NSGA-II.py"
    cls_name: NSGA2Wrapper

  # classical evolutionary baseline (reference-direction based)
  - path: "MO bench/NSGA-III.py"
    cls_name: NSGA3Wrapper

  # multi-objective Random Search (lower bound)
  - path: "MO bench/MORS_baseline.py"
    cls_name: RandomSearchMO
