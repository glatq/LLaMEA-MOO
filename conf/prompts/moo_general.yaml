prompts:
  lib_prompt: "As an expert in numpy, scipy, scikit-learn, torch, and gpytorch, you are allowed to use these libraries. "
  task_mode_prompt: |
    If you use surrogate models, consider using a sliding window of recent data (e.g., the most recent 200-500 points) to keep model fitting tractable. Avoid deep neural networks. Do not use any other libraries unless they cannot be replaced by the above libraries. Do not remove the comments from the code. Name the class based on the characteristics of the algorithm with a template 'MOBO<Something>'.
    The primary performance metric is Hypervolume (HV) maximization with respect to a fixed reference point. HV and the reference point are handled externally by the evaluator; your algorithm only needs to return a good approximation of the Pareto front (F_pareto, X_pareto). Do not compute the full hypervolume indicator inside the algorithm.

    HYPERPARAMETER OPTIMIZATION: Any hyperparameters your algorithm uses will be automatically optimized by SMAC (Sequential Model-Based Algorithm Configuration). You must provide a configuration space as a Python dictionary that defines the hyperparameter search space. Do NOT include the parameters budget, dim, or bounds in the configuration space, as these are problem-specific and fixed. Include all other tunable hyperparameters in the __init__ method with default values, and define their search ranges in the configuration space.

    Configuration space format:
    {
        "param_name": (lower_bound, upper_bound),  # For continuous or integer ranges
        "log_param": (lower, upper, "log"),  # For log-scale continuous parameters
        "categorical_param": ["option1", "option2", "option3"]  # For categorical choices
    }

    CONFIGURATION SPACE GUIDELINES: Keep the configuration space compact with 3-7 hyperparameters. Avoid extremely large ranges for candidate counts (keep under 500) and model training iterations (keep under 100). Use log-scale ranges for parameters that span orders of magnitude (e.g., learning rates, regularization). Ensure n_init never exceeds the evaluation budget; use a budget-aware default such as min(2*dim+1, budget//4).

    CRITICAL ROBUSTNESS REQUIREMENT: The algorithm's internal search logic (especially the acquisition function and model fitting) MUST be stable and general across all objective scales.
    Any scalarization method (e.g., Tchebycheff or weighted sum) MUST be applied to objectives that are normalized and scaled.
    The normalization MUST be calculated dynamically based on the current observed objective ranges: using the minimum observed value (Ideal Point) and the maximum observed value (Nadir Point) from the archive (`self.y_all`) to scale all objectives to the $[0, 1]$ range.
    This normalization is essential to prevent early pathological evaluations from destabilizing the acquisition function and steering the search to irrelevant regions.

    If you use hypervolume-based acquisition (e.g., EHVI), you may choose a simple and lightweight internal reference point (for example based on the current observed nadir). This internal reference point is used only for acquisition scoring and does not need to match the evaluator's reference point. Any HV-related computation used for acquisition must remain local and inexpensive (for example, small candidate sets), and must not compute HV over the entire archive.
    You can assume typical problem dimensionalities between 2 and 20 and evaluation budgets between 50 and 500. The algorithm must remain computationally lightweight in Python. Its cost should scale approximately linearly with the number of evaluations and dimensions and should avoid O(budget^2) operations in the main loop (for example, repeated full-archive dominance checks, full hypervolume calculations, or large nested Python loops).
    Give a robust, computationally efficient multi-objective optimization algorithm to solve this task. You are free to choose any approach: surrogate-assisted Bayesian optimization, evolutionary strategies, decomposition methods, or novel hybrid combinations. The algorithm should be conceptually clear and not overly complex. Give the algorithm a concise but comprehensive key-word-style description with the main ideas and justify your decision about the algorithm.
  code_structure_template: |

    ```python
    import numpy as np

    class RandomSearchMO:
        def __init__(self, budget=10000, dim=10, bounds=None, **hyperparameters):
            # budget, dim, bounds are fixed problem parameters
            self.budget = int(budget)
            self.dim = int(dim)
            self.bounds = bounds

            # Example hyperparameters (these would be defined in Space)
            # self.param1 = hyperparameters.get('param1', default_value1)
            # self.param2 = hyperparameters.get('param2', default_value2)

        @staticmethod
        def _dominates(a: np.ndarray, b: np.ndarray) -> bool:
            # Pareto dominance for minimization
            return np.all(a <= b) and np.any(a < b)

        def __call__(self, func):
            X = []  # decision vectors in archive
            F = []  # objective vectors in archive

            low, high = self.bounds[0], self.bounds[1]

            for _ in range(self.budget):
                x = np.random.uniform(low, high)  # shape (dim,)
                f = np.asarray(func(x), dtype=float).ravel()  # shape (M,)

                # If dominated by any current archive point -> skip
                if any(self._dominates(fi, f) for fi in F):
                    continue

                # Otherwise, remove points dominated by the newcomer
                keep = [i for i, fi in enumerate(F) if not self._dominates(f, fi)]
                if len(keep) != len(F):
                    X = [X[i] for i in keep]
                    F = [F[i] for i in keep]

                # Add newcomer
                X.append(x)
                F.append(f)

            # Return as numpy arrays, one row per solution
            if len(F) == 0:
                # No nondominated found (only possible if budget==0); fall back to empty arrays
                return np.empty((0,)), np.empty((0, self.dim))
            return np.vstack(F), np.vstack(X)
    ```
