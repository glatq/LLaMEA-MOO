# moo_prompts.yaml

role_prompt: """
You are a highly skilled computer scientist in the field of natural computing. Your task is to design a highly generalizable, scale-invariant multi-objective metaheuristic algorithm to solve arbitrary black-box optimization problems that are both effective and computationally lightweight in Python. The total runtime of the algorithm should be dominated by calls to the objective function, not by internal overhead.
"""

# --- Task Descriptions ---

base_task_description: """
Your task is to write a multi-objective Bayesian optimization algorithm in Python code. The code must define a class with an __init__(self, budget, dim, bounds) method and a __call__(self, func) method. The __call__ method must optimize the black-box function func using at most self.budget evaluations. The function func takes an array of shape (dim,) and returns an array of shape (M,) (one value per objective). One budget unit corresponds to one call of func that returns all objectives.
The algorithm must use the provided bounds array of shape (2, dim) for all sampling, clipping, and candidate-generation steps. It must not hard-code or assume alternative bounds. The dimensionality dim can vary.
You may use numpy, scipy, scikit-learn, torch, and gpytorch. You must avoid obviously redundant computations or architectural choices that make the algorithm unnecessarily slow relative to the evaluation budget and dimensionality. Use gpytorch only when CUDA is available (for example, when torch.cuda.is_available() is true); otherwise prefer scikit-learn or plain torch implementations for Gaussian processes or other surrogate models. You should not introduce heavy deep neural networks or very expensive models if their training or prediction cost becomes comparable to or larger than the cost of the black-box evaluations themselves. Do not use any other libraries unless they cannot be replaced by the ones listed above. Do not remove comments from the code.
Name the class using the template MOBO<Something>, where the suffix concisely reflects the main characteristics of the algorithm.
The performance metric is external hypervolume (HV) maximization with respect to a fixed reference point. HV is handled externally by the evaluator. Your algorithm must return an approximation of the Pareto set as (F_pareto, X_pareto) and must not compute the full hypervolume indicator internally.
There is a critical robustness requirement on objective scaling. The algorithm’s internal search logic, especially acquisition functions and model fitting, must be stable and general across arbitrary objective scales. Before any scalarization or acquisition evaluation, you must normalize the objectives dynamically based on the current archive self.y_all. Use the empirically observed ideal and nadir values for each objective to map all objectives into the [0, 1] range. Any scalarization method, such as Tchebycheff or weighted sums, must operate on these normalized values. This normalization is essential to prevent early pathological evaluations or mismatched objective scales from destabilizing the acquisition function and steering the search into irrelevant regions.
If you use hypervolume-based acquisition functions such as EHVI, you may choose a simple and lightweight internal reference point derived from current observations, for example based on the current observed nadir. This internal reference point is used only for acquisition scoring and does not have to match the evaluator’s external reference point. Any HV-related computation used as part of the acquisition must remain local and inexpensive, for example by operating on small candidate sets, and must not compute HV over the entire archive.
You can assume typical problem dimensionalities between 2 and 20 and evaluation budgets between 50 and 500. The algorithm must remain computationally reasonable in Python. Its cost should scale approximately linearly with the number of evaluations and dimensions and should avoid clearly quadratic or worse behaviour in the main loop, such as repeated full-archive dominance checks, full hypervolume calculations, or large nested Python loops over the archive.
You must give a robust, computationally efficient multi-objective Bayesian optimization algorithm. It must remain strictly within the multi-objective Bayesian optimization paradigm, using probabilistic surrogate models and acquisition functions to guide sampling. The design should be conceptually clear and not unnecessarily complex.
Within this MOBO framework you are free to innovate. You may choose and configure surrogate models, for example separate Gaussian processes per objective, scalarized Gaussian processes, sparse or approximate Gaussian processes, or other probabilistic surrogates, as long as their use is consistent with the computational constraints above. You may choose different normalization-aware scalarization schemes, such as Tchebycheff or ParEGO-style random-weight scalarizations, or multi-objective acquisition strategies, such as EHVI variants or scalarized expected improvement. You may design different batch candidate generation and filtering strategies, as well as model-management strategies such as sliding training windows or periodic retraining.
Give the algorithm a concise, key-word-style description of its main ideas, and justify your design choices in terms of robustness, sample efficiency, and suitability for multi-objective test problems under the given constraints.
"""

