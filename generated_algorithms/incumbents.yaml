# SMAC incumbent hyperparameters for the nine best-of-run LLaMEA-generated
# algorithms, as recorded during the generation runs. Pass these to
# benchmark_best_codes.py via `init_kwargs:` to reproduce the paper's
# Phase 1-3 results; omit them to reproduce the Table III 'LLM defaults' half.
#
# run / generation / index / search_fitness identify the individual inside the
# generation run (search fitness = mean ref-box-normalized HV on the 9-problem
# training suite, budget 200, 3 repeats).

