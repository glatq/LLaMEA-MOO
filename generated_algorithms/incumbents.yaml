  run: exp_mo_1plus1_run1
  strategy: "(1+1)-ES"
  generation: 68
  index: 69
  search_fitness: 0.5317
  init_kwargs:
    alpha_noise: 6.9529602e-06
    batch_size: 20
    kappa: 3.0653172894207
    model_restarts: 4
    n_candidates_per_iteration: 153
    n_initial_design_points: 9
    num_weights: 72
