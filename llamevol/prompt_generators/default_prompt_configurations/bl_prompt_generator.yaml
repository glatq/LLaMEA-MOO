  code_structure_template: |
  
    ```python
    import numpy as np
  
    class RandomSearch:
        def __init__(self, budget=10000, dim=10, param1=default1, param2=default2):
            self.budget = budget
            self.dim = dim
            # bounds has (2,<dimension>), bounds[0]: lower bound, bounds[1]: upper bound
            self.bounds = np.array([[-5.0]*dim, [5.0]*dim])
    
            # Hyperparameters (tuned by SMAC, defined in Space)
            self.param1 = param1
            self.param2 = param2
    
            self.f_opt = np.Inf
            self.x_opt = None
  
        def __call__(self, func):
            for i in range(self.budget):
                x = np.random.uniform(self.bounds[0], self.bounds[1])
  
                f = func(x)
                if f < self.f_opt:
                    self.f_opt = f
                    self.x_opt = x
  
            return self.f_opt, self.x_opt
    ```
