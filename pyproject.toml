[tool.poetry]
name = "llamevol"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
numpy = "1.24.4"
ioh = "^0.3.18"
# NOTE: two Phase-1 algorithms (MOBORobustLCBFPS, MOBOEnsembleRidge_MPFDUWS) were
# generated against scikit-learn 1.3.x and call BaggingRegressor(base_estimator=...),
# an argument removed in scikit-learn 1.4. Reproducing their Phase-1 rows needs a
# separate env with "scikit-learn<1.4" (1.3.2+ for Python 3.12 wheels). Phases 2-3 --
# every headline result -- were produced with 1.7.2, as pinned in poetry.lock.
scikit-learn = ">=1.3.0"
pandas = "2.0.3"
tqdm = "^4.66.4"
jsonlines = "^4.0.0"
smac = "^2.4.0"
requests = "^2.32.3"
python-dotenv = "^1.0.1"
botorch = "^0.16.1"
gpytorch = "^1.15"
sentence-transformers = "^3.4.0"
scikit-optimize = "^0.10.2"
langchain-core = "^0.3"
langchain-openai = "^0.3"
langchain-google-genai = "^2.1"
langchain-google-vertexai = "^2.0"
langchain-anthropic = "^0.3"
cma = "3.2.2"
hebo = "^0.3.6"
cmaes = "^0.11.1"
hydra-core = "^1.3.2"
omegaconf = "^2.3.0"
bofire = {extras = ["optimization"], version = "^0.3.1"}
# bofire 0.3.1 needs a newer pydantic than 2.7 (collections.abc.Sequence schema
# generation) and, via shap->numba, a coverage with coverage.types.Tracer (>=7.10).
pydantic = "^2.13"
# packaging >=24.2 provides packaging.licenses, required by the Poetry version
# installed in this env; keeps `poetry lock`/`check` working after install.
packaging = "^24.2"

#[tool.poetry.dev-dependencies]
#black = "^23.11.0"
#isort = "^5.12.0"
coco-experiment = "^2.8.1"

[tool.poetry.group.dev.dependencies]
black = "^23.11.0"
isort = "^5.12.0"
pytest = "^7.4.3"
jupyter = "^1.0.0"
pytest-cov = "^4.1.0"
codecov = "^2.1.13"
pytest-mock = "^3.14.0"
# numba (pulled via bofire[optimization] -> shap) needs coverage.types.Tracer (>=7.10)
coverage = "^7.10"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning:smac.*",
    "ignore::DeprecationWarning:importlib._bootstrap.*",
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:builtin type swig:DeprecationWarning",
]

[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"