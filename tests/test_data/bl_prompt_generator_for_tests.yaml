problem_desc: "24 noiseless functions"

prompts:
  role_prompt: "You are a highly skilled computer scientist in the field of natural computing. Your task is to design novel metaheuristic algorithms to solve black box optimization problems"
  pre_solution_prompt_template: "algorithms have been designed. The new algorithm should be as **diverse** as possible from the previous ones on every aspect.\nIf the errors from the previous algorithms are provided, analyze them. The new algorithm should be designed to avoid these errors.\n"
  code_structure_intro: "A code structure guide is as follows and keep the comments from the guide when generating the code.\n"
  crossover_operator: "Combine the selected solutions to create a new solution. Then refine the strategy of the new solution to improve it. If the errors from the previous algorithms are provided, analyze them. The new algorithm should be designed to avoid these errors.\n"
  selected_solutions_intro: "The selected solutions to update are:\n"
  selected_solution_intro: "The selected solution to update is:\n"
  mutation_operator: "Refine the strategy of the selected solution to improve it."
  population_summary_intro: "The current population of algorithms already evaluated(name, score, runtime and description):\n"
  candidate_code_wrapper: "```python\n{code}\n```"
  no_code_exception_msg: "No code was extracted. The code should be encapsulated with ``` in your response."
  general_error_msg: "An error occurred : {error}"
  candidate_prompt_template: "{description}\nWith code:\n{solution}\n{feedback}\n"
  output_format_prompt: |

    Give the response in the format:
    # Description
    <description>
    # Justification
    <justification for the key components of the algorithm or the changes made>
    # Code
    <code>

  task_domain_prompt: |
    The optimization algorithm should handle a wide range of tasks, which is evaluated on the BBOB test suite of {problem_desc}. Your task is to write the optimization algorithm in Python code. The code should contain an `__init__(self, budget, dim)` function and the function `__call__(self, func)`, which should optimize the black box function `func` using `self.budget` function evaluations.
    The func() can only be called as many times as the budget allows, not more. Each of the optimization functions has a search space between -5.0 (lower bound) and 5.0 (upper bound). The dimensionality can be varied.
  lib_prompt: ""
  task_mode_prompt: |
    Give an excellent, novel and computationally efficient heuristic algorithm to solve this task, give it a concise but comprehensive key-word-style description with the main idea and justify your decision about the algorithm.
  code_structure_template: |

    ```python
    import numpy as np

    class RandomSearch:
        def __init__(self, budget=10000, dim=10):
            self.budget = budget
            self.dim = dim
            # bounds has (2,<dimension>), bounds[0]: lower bound, bounds[1]: upper bound
            self.bounds = np.array([[-5.0]*dim, [5.0]*dim])
            self.f_opt = np.Inf
            self.x_opt = None

        def __call__(self, func):
            for i in range(self.budget):
                x = np.random.uniform(self.bounds[0], self.bounds[1])

                f = func(x)
                if f < self.f_opt:
                    self.f_opt = f
                    self.x_opt = x

            return self.f_opt, self.x_opt
    ```
  time_prompt_template: "took {execution_time} seconds to run."
  main_aoc_prompt_template: "The algorithm {algorithm_name} got an average Area over the convergence curve (AOCC, 1.0 is the best) score of {auc_mean} with standard deviation {auc_std}.\n"
