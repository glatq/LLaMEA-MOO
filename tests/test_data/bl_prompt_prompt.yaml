role_prompt: You are a highly skilled computer scientist in the field of natural computing.
  Your task is to design novel metaheuristic algorithms to solve black box optimization
  problems
initialize_solution: "\nThe optimization algorithm should handle a wide range of tasks,\
  \ which is evaluated on the BBOB test suite of 24 noiseless functions. Your task\
  \ is to write the optimization algorithm in Python code. The code should contain\
  \ an `__init__(self, budget, dim)` function and the function `__call__(self, func)`,\
  \ which should optimize the black box function `func` using `self.budget` function\
  \ evaluations.\nThe func() can only be called as many times as the budget allows,\
  \ not more. Each of the optimization functions has a search space between -5.0 (lower\
  \ bound) and 5.0 (upper bound). The dimensionality can be varied.\nGive an excellent,\
  \ novel and computationally efficient heuristic algorithm to solve this task, give\
  \ it a concise but comprehensive key-word-style description with the main idea and\
  \ justify your decision about the algorithm.\n\n\nA code structure guide is as follows\
  \ and keep the comments from the guide when generating the code.\n\n```python\n\
  import numpy as np\n\nclass RandomSearch:\n    def __init__(self, budget=10000,\
  \ dim=10):\n        self.budget = budget\n        self.dim = dim\n        # bounds\
  \ has (2,<dimension>), bounds[0]: lower bound, bounds[1]: upper bound\n        self.bounds\
  \ = np.array([[-5.0]*dim, [5.0]*dim])\n        self.f_opt = np.Inf\n        self.x_opt\
  \ = None\n\n    def __call__(self, func):\n        for i in range(self.budget):\n\
  \            x = np.random.uniform(self.bounds[0], self.bounds[1])\n\n         \
  \   f = func(x)\n            if f < self.f_opt:\n                self.f_opt = f\n\
  \                self.x_opt = x\n\n        return self.f_opt, self.x_opt\n```\n\n\
  \nGive the response in the format:\n# Description \n<description>\n# Justification\
  \ \n<justification for the key components of the algorithm or the changes made>\n\
  # Code \n<code>\n"
