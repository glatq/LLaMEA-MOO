code: 'from collections.abc import Callable\nfrom scipy.stats import qmc\nfrom scipy.stats import norm\nimport numpy as np\nfrom sklearn.gaussian_process import GaussianProcessRegressor\nfrom sklearn.gaussian_process.kernels import RBF, ConstantKernel as C\nimport warnings\n\n# Suppress sklearn ConvergenceWarning for GPR to keep output clean\nwarnings.filterwarnings("ignore", category=UserWarning, module="sklearn.gaussian_process")\n\n\nclass MOBO_GP_TchebycheffEI:\n    """\n    Multi-Objective Bayesian Optimization (MOBO) algorithm using Gaussian Processes\n    and a Tchebycheff-based Expected Improvement (EI) acquisition function.\n    """\n\n    def __init__(self, budget: int, dim: int, bounds: np.ndarray | None = None):\n        """\n        Initializes the MOBO algorithm.\n\n        Args:\n            budget (int): The total number of function evaluations allowed.\n            dim (int): The dimensionality of the search space.\n            bounds (np.ndarray | None): A (2, dim) array specifying the lower and upper\n                                        bounds for each dimension. If None, defaults to [0, 1]^dim.\n        """\n        self.budget = budget\n        self.dim = dim\n        # bounds has shape (2, dim), bounds[0]: lower bound, bounds[1]: upper bound\n        if bounds is None:\n            self.bounds = np.array([[0.0] * dim, [1.0] * dim], dtype=float)\n        else:\n            self.bounds = np.asarray(bounds, dtype=float)\n\n        # The number of objectives (self.n_obj) is unknown a priori.\n        # It MUST be inferred on the first call to func inside _evaluate_points.\n        self.n_obj: int | None = None\n\n        # X has shape (n_points, n_dims), y has shape (n_points, n_obj)\n        self.X: np.ndarray | None = None  # Archive of evaluated design points\n        self.y: np.ndarray | None = None  # Archive of corresponding objective values\n        self.n_evals = 0  # The number of function evaluations performed\n\n        # Choose a reasonable number of initial evaluations.\n        # At least dim + 1 points are needed for GP fitting.\n        # Ensure it\'s not too large a fraction of the budget and at least 1 iteration remains.\n        self.n_init = max(self.dim + 1, 5)\n        self.n_init = min(self.n_init, self.budget - 1)\n\n        # Internal batch size for selecting points in each iteration after initial design.\n        self.batch_size = 1\n\n        # Limit for surrogate model training data to keep fitting computationally cheap.\n        self.max_train_size = 200\n\n        # List of Gaussian Process Regressors, one for each objective.\n        self.models: list[GaussianProcessRegressor] = []\n\n        # Ideal Point (minimum observed value for each objective) for dynamic normalization.\n        self.ideal_point: np.ndarray | None = None\n        # Nadir Point (maximum observed value for each objective) for dynamic normalization.\n        self.nadir_point: np.ndarray | None = None\n\n        # Number of candidate points to generate for acquisition function evaluation.\n        self.num_acquisition_candidates = max(100 * self.dim, 1000)\n        # Number of random weight vectors to use for Tchebycheff scalarization averaging.\n        self.num_weights = 100\n\n    def _sample_points(self, n_points: int) -> np.ndarray:\n        """\n        Samples n_points candidate points efficiently within self.bounds using Sobol sequence.\n\n        Args:\n            n_points (int): The number of points to sample.\n\n        Returns:\n            np.ndarray: An array of shape (n_points, self.dim) containing the sampled points.\n        """\n        sampler = qmc.Sobol(d=self.dim, scramble=True)\n        # Generate points in [0, 1]^dim\n        sample = sampler.random(n_points)\n        # Scale to self.bounds\n        lb, ub = self.bounds[0], self.bounds[1]\n        scaled_sample = lb + sample * (ub - lb)\n        return scaled_sample\n\n    def _fit_model(self, X_train: np.ndarray, y_train: np.ndarray):\n        """\n        Fits a Gaussian Process Regressor for each objective on the provided training data.\n        Uses a sliding window to limit the training set size.\n\n        Args:\n            X_train (np.ndarray): Training input data of shape (n_samples, self.dim).\n            y_train (np.ndarray): Training output data of shape (n_samples, self.n_obj).\n        """\n        # Use a sliding window to limit the number of training points\n        if len(X_train) > self.max_train_size:\n            X_train = X_train[-self.max_train_size:]\n            y_train = y_train[-self.max_train_size:]\n\n        self.models = []\n        # A robust kernel combining a ConstantKernel (for output scale) and RBF kernel.\n        # Bounds for length_scale are set to allow for broad optimization.\n        kernel = C(1.0, (1e-3, 1e3)) * RBF(length_scale=np.ones(self.dim), length_scale_bounds=(1e-5, 1e5))\n        for i in range(self.n_obj):\n            # Fit one GP per objective. alpha adds noise to the diagonal of the covariance matrix.\n            # n_restarts_optimizer helps find better hyperparameters. normalize_y=False as we handle it explicitly.\n            gp = GaussianProcessRegressor(kernel=kernel, alpha=1e-6, n_restarts_optimizer=10, normalize_y=False)\n            gp.fit(X_train, y_train[:, i])\n            self.models.append(gp)\n\n    def _predict(self, X: np.ndarray) -> tuple[np.ndarray, np.ndarray]:\n        """\n        Predicts the mean and standard deviation for each objective for given input points.\n\n        Args:\n            X (np.ndarray): Input points of shape (n_points, self.dim).\n\n        Returns:\n            tuple[np.ndarray, np.ndarray]: A tuple containing:\n                - mu (np.ndarray): Predicted means of shape (n_points, self.n_obj).\n                - sigma (np.ndarray): Predicted standard deviations of shape (n_points, self.n_obj).\n        """\n        mu_list = []\n        sigma_list = []\n        for gp in self.models:\n            mu, sigma = gp.predict(X, return_std=True)\n            mu_list.append(mu)\n            sigma_list.append(sigma)\n        return np.array(mu_list).T, np.array(sigma_list).T\n\n    def _acquisition_function(self, X_candidates: np.ndarray) -> np.ndarray:\n        """\n        Calculates the Tchebycheff-based Expected Improvement (EI) for a set of candidate points.\n        Objectives are dynamically normalized based on current ideal/nadir points.\n\n        Args:\n            X_candidates (np.ndarray): Candidate points of shape (n_candidates, self.dim).\n\n        Returns:\n            np.ndarray: A 1-D array of shape (n_candidates,) with acquisition scores.\n        """\n        if self.ideal_point is None or self.nadir_point is None:\n            # This should not happen after initial evaluations, but as a safeguard.\n            return np.zeros(len(X_candidates))\n\n        # Dynamically normalize current archive objectives to [0, 1]\n        range_y = self.nadir_point - self.ideal_point\n        range_y[range_y == 0] = 1e-9  # Add a small epsilon to avoid division by zero\n\n        y_norm_archive = (self.y - self.ideal_point) / range_y\n\n        # Predict mean and standard deviation for candidate points\n        mu_objs, sigma_objs = self._predict(X_candidates)\n\n        # Normalize predicted means and standard deviations\n        mu_objs_norm = (mu_objs - self.ideal_point) / range_y\n        sigma_objs_norm = sigma_objs / range_y\n\n        acquisition_values = np.zeros(len(X_candidates))\n\n        # Generate random weight vectors once for all candidates to improve efficiency\n        weights = np.random.dirichlet(np.ones(self.n_obj), size=self.num_weights)\n\n        # Calculate the best Tchebycheff value found so far for each weight vector\n        # This is min_{y_arch in archive} max_j(w_j * y_arch_j_norm)\n        # weights[:, None, :] broadcasts weights for each archive point\n        # y_norm_archive[None, :, :] broadcasts archive points for each weight\n        f_best_w_per_weight = np.min(np.max(weights[:, None, :] * y_norm_archive[None, :, :], axis=2), axis=1)\n\n        for i in range(len(X_candidates)):\n            # For each candidate, calculate its acquisition score by averaging over weight vectors\n            \n            # Approximate mean of the scalarized function for the candidate\n            # using the maximum term in the Tchebycheff function\n            weighted_mu_norm = weights * mu_objs_norm[i]  # (num_weights, n_obj)\n            scalarized_mu_per_weight = np.max(weighted_mu_norm, axis=1)  # (num_weights,)\n\n            # Find the index of the dominating objective for each weight vector\n            idx_max_per_weight = np.argmax(weighted_mu_norm, axis=1)  # (num_weights,)\n            \n            # Approximate standard deviation of the scalarized function by using the std\n            # of the dominating objective for each weight vector.\n            scalarized_sigma_per_weight = sigma_objs_norm[i, idx_max_per_weight]  # (num_weights,)\n\n            # Calculate Expected Improvement for each weight vector\n            # Handle cases with very small or zero standard deviation to prevent numerical issues.\n            zeros_sigma_mask = scalarized_sigma_per_weight < 1e-9\n            \n            Z = np.zeros_like(scalarized_sigma_per_weight)\n            # Compute Z for non-zero sigmas\n            Z[~zeros_sigma_mask] = (f_best_w_per_weight[~zeros_sigma_mask] - scalarized_mu_per_weight[~zeros_sigma_mask]) / scalarized_sigma_per_weight[~zeros_sigma_mask]\n            \n            ei_vals = np.zeros_like(scalarized_sigma_per_weight)\n            \n            # EI for zero sigma: only if predicted mean is better than f_best_w\n            ei_vals[zeros_sigma_mask] = np.maximum(0, f_best_w_per_weight[zeros_sigma_mask] - scalarized_mu_per_weight[zeros_sigma_mask])\n            # EI for non-zero sigma using the standard formula\n            ei_vals[~zeros_sigma_mask] = (f_best_w_per_weight[~zeros_sigma_mask] - scalarized_mu_per_weight[~zeros_sigma_mask]) * norm.cdf(Z[~zeros_sigma_mask]) + scalarized_sigma_per_weight[~zeros_sigma_mask] * norm.pdf(Z[~zeros_sigma_mask])\n            \n            acquisition_values[i] = np.mean(ei_vals) # Average EI over all weight vectors\n\n        return acquisition_values\n\n    def _select_next_points(self, batch_size: int) -> np.ndarray:\n        """\n        Selects the next batch of points to evaluate based on the acquisition function.\n\n        Args:\n            batch_size (int): The number of points to select.\n\n        Returns:\n            np.ndarray: An array of shape (batch_size, self.dim) with the selected points.\n        """\n        # Generate a pool of candidate points using QMC for diversity\n        candidate_pool = self._sample_points(self.num_acquisition_candidates)\n        # Evaluate acquisition function for all candidates\n        acquisition_scores = self._acquisition_function(candidate_pool)\n\n        # Select batch_size points with the highest acquisition values\n        best_indices = np.argsort(acquisition_scores)[::-1][:batch_size]\n        return candidate_pool[best_indices]\n\n    def _evaluate_points(self, func: Callable[[np.ndarray], np.ndarray], X_to_eval: np.ndarray) -> np.ndarray:\n        """\n        Evaluates the given points using the black-box function `func`.\n        This method is the only place where `func` is called.\n        It handles budget constraints and infers `self.n_obj` on the first call.\n\n        Args:\n            func (Callable[[np.ndarray], np.ndarray]): The black-box objective function.\n            X_to_eval (np.ndarray): Points to evaluate, shape (n_points, self.dim).\n\n        Returns:\n            np.ndarray: Evaluated objective values, shape (n_points, self.n_obj).\n        """\n        # Adjust X_to_eval to not exceed the total budget\n        if self.n_evals + len(X_to_eval) > self.budget:\n            X_to_eval = X_to_eval[:self.budget - self.n_evals]\n            if len(X_to_eval) == 0:\n                return np.array([])  # No points left to evaluate\n\n        # Clip points to self.bounds before calling func to respect the problem domain\n        lb, ub = self.bounds[0], self.bounds[1]\n        X_clipped = np.clip(X_to_eval, lb, ub)\n\n        new_y_values = []\n        for x_point in X_clipped:\n            y_val = func(x_point)\n            # Infer n_obj from the first evaluation\n            if self.n_obj is None:\n                self.n_obj = len(y_val)\n            elif len(y_val) != self.n_obj:\n                raise ValueError(f"Function returned {len(y_val)} objectives, but expected {self.n_obj}.")\n            new_y_values.append(y_val)\n        \n        self.n_evals += len(X_clipped) # Update total evaluations count\n        return np.array(new_y_values)\n\n    def _is_dominated(self, a: np.ndarray, b: np.ndarray) -> bool:\n        """\n        Checks if point \'a\' dominates point \'b\' for minimization.\n\n        Args:\n            a (np.ndarray): Objective vector of point \'a\'.\n            b (np.ndarray): Objective vector of point \'b\'.\n\n        Returns:\n            bool: True if \'a\' dominates \'b\', False otherwise.\n        """\n        # \'a\' dominates \'b\' if \'a\' is less than or equal to \'b\' in all objectives\n        # AND \'a\' is strictly less than \'b\' in at least one objective.\n        return np.all(a <= b) and np.any(a < b)\n\n    def _update_eval_points(self, new_X: np.ndarray, new_y: np.ndarray):\n        """\n        Updates the archive of evaluated points (self.X, self.y) with new evaluations.\n        Maintains only non-dominated points efficiently using an incremental strategy.\n        Also updates the ideal and nadir points.\n\n        Args:\n            new_X (np.ndarray): New design points evaluated, shape (n_new, self.dim).\n            new_y (np.ndarray): Corresponding new objective values, shape (n_new, self.n_obj).\n        """\n        if self.X is None:\n            # If archive is empty, initialize it with the new points\n            self.X = new_X\n            self.y = new_y\n        else:\n            # Convert to lists for easier manipulation during filtering\n            current_X_list = self.X.tolist()\n            current_y_list = self.y.tolist()\n            \n            new_X_filtered = []\n            new_y_filtered = []\n\n            # Step 1: Filter new_y points. Keep only those not dominated by the current archive.\n            # This is O(batch_size * N_archive * n_obj)\n            for i in range(len(new_X)):\n                is_dominated_by_archive = False\n                for existing_y_point in current_y_list:\n                    if self._is_dominated(np.array(existing_y_point), new_y[i]):\n                        is_dominated_by_archive = True\n                        break\n                if not is_dominated_by_archive:\n                    new_X_filtered.append(new_X[i])\n                    new_y_filtered.append(new_y[i])\n            \n            # If no new non-dominated points are found, just update ideal/nadir and return\n            if not new_y_filtered:\n                self.ideal_point = np.min(self.y, axis=0)\n                self.nadir_point = np.max(self.y, axis=0)\n                return\n\n            new_X_filtered_np = np.array(new_X_filtered)\n            new_y_filtered_np = np.array(new_y_filtered)\n\n            # Step 2: Filter current archive. Keep only points not dominated by the filtered new_y.\n            # This is O(N_archive * batch_size * n_obj)\n            archive_X_to_keep = []\n            archive_y_to_keep = []\n            for i in range(len(current_y_list)):\n                is_dominated_by_new = False\n                for filtered_new_y_point in new_y_filtered_np:\n                    if self._is_dominated(filtered_new_y_point, np.array(current_y_list[i])):\n                        is_dominated_by_new = True\n                        break\n                if not is_dominated_by_new:\n                    archive_X_to_keep.append(current_X_list[i])\n                    archive_y_to_keep.append(current_y_list[i])\n\n            # Step 3: Combine the filtered archive and filtered new points to form the new archive\n            self.X = np.vstack((np.array(archive_X_to_keep), new_X_filtered_np))\n            self.y = np.vstack((np.array(archive_y_to_keep), new_y_filtered_np))\n        \n        # Update ideal and nadir points from the current (updated) archive\n        self.ideal_point = np.min(self.y, axis=0)\n        self.nadir_point = np.max(self.y, axis=0)\n\n    def __call__(self, func: Callable[[np.ndarray], np.ndarray]) -> tuple[np.ndarray, np.ndarray]:\n        """\n        Executes the main multi-objective optimization loop.\n\n        Args:\n            func (Callable[[np.ndarray], np.ndarray]): The black-box objective function.\n\n        Returns:\n            tuple[np.ndarray, np.ndarray]: A tuple (F_pareto, X_pareto) where\n                                          F_pareto is the final non-dominated objective values\n                                          and X_pareto is the corresponding design points.\n        """\n        # Initial design phase: evaluate a set of initial points\n        initial_X = self._sample_points(self.n_init)\n        initial_y = self._evaluate_points(func, initial_X)\n        \n        # Handle cases where budget is too small for initial evaluations\n        if initial_y.size == 0:\n            return np.array([]), np.array([])\n        \n        self._update_eval_points(initial_X, initial_y)\n\n        # Main optimization loop: iterate until budget is exhausted\n        while self.n_evals < self.budget:\n            # 1. Fit or update the surrogate model using the current archive.\n            self._fit_model(self.X, self.y)\n\n            # 2. Use the acquisition function and _select_next_points to pick new candidates.\n            next_X_to_eval = self._select_next_points(self.batch_size)\n            \n            # If no points were selected (e.g., acquisition scores were all zero), or budget is too low\n            if len(next_X_to_eval) == 0:\n                break\n\n            # 3. Evaluate candidates with _evaluate_points, respecting the remaining budget.\n            new_y_values = self._evaluate_points(func, next_X_to_eval)\n            \n            # If budget ran out during evaluation (e.g., only part of batch was evaluated)\n            if new_y_values.size == 0:\n                break\n\n            # 4. Update the archive with _update_eval_points, keeping only non-dominated points.\n            self._update_eval_points(next_X_to_eval, new_y_values)\n\n        # Return the final non-dominated set (F_pareto, X_pareto)\n        # The _update_eval_points method ensures that self.y and self.X always contain\n        # the non-dominated points from all evaluations so far.\n        return self.y, self.X\n\n'

response: "# Description\n**MOBO_GP_TchebycheffEI: Multi-Objective Bayesian Optimization with Gaussian Processes and Tchebycheff-based Expected Improvement**\n\nThis algorithm implements a multi-objective Bayesian Optimization (MOBO) strategy designed for black-box optimization problems with an arbitrary number of objectives. It uses a surrogate-model-assisted approach to efficiently explore the search space and identify the Pareto front.\n\nKey features:\n*   **Gaussian Processes (GPs)**: A separate Gaussian Process Regressor is fitted for each objective function. These GPs model the mean and uncertainty of the objective values across the search space. To maintain computational lightness, the training data for GPs is limited to a sliding window of the most recent `max_train_size` evaluations.\n*   **Tchebycheff-based Expected Improvement (EI)**: The acquisition function employs a Tchebycheff scalarization approach. For each candidate point, multiple random weight vectors are sampled (using a Dirichlet distribution). For each weight vector, the Tchebycheff scalarized value is computed, and its Expected Improvement (EI) is approximated. The final acquisition score for a candidate is the average EI across all weight vectors.\n*   **Dynamic Objective Normalization**: A critical robustness feature is the dynamic normalization of objective values. Before being used in the Tchebycheff scalarization and EI calculation, all objective values (both observed and predicted) are scaled to the `[0, 1]` range. This scaling is based on the currently observed minimum (Ideal Point) and maximum (Nadir Point) values for each objective in the archive. This prevents issues with varying objective scales and ensures the acquisition function remains stable.\n*   **Incremental Pareto Archive Maintenance**: The algorithm maintains an archive of non-dominated (Pareto-optimal) points. New evaluations are efficiently incorporated into this archive using an incremental update strategy that avoids expensive full re-computations of the Pareto front. This ensures the total computational cost for archive maintenance scales efficiently with the budget.\n*   **Quasi-Monte Carlo (QMC) Sampling**: Initial design points and candidate points for acquisition function evaluation are generated using Sobol sequences (a type of QMC), ensuring good space-filling properties.\n*   **Budget-aware and Scale-Invariant**: The algorithm respects the total evaluation budget, infers the number of objectives (`self.n_obj`) at runtime, and uses the provided `bounds` for all sampling and clipping operations, making it generalizable across different problem dimensionalities and objective counts.\n\n# Justification\n1.  **Gaussian Processes as Surrogate Models**: GPs are a standard choice for Bayesian Optimization due to their ability to provide both mean predictions and uncertainty estimates, which are crucial for EI-based acquisition functions. `sklearn.gaussian_process.GaussianProcessRegressor` is chosen for its simplicity and robustness, fitting one GP per objective. The `max_train_size` limit (e.g., 200 points) ensures that the `O(N^3)` training cost of GPs remains computationally cheap, as `N` is bounded.\n2.  **Tchebycheff-based Expected Improvement (ParEGO-like)**: This acquisition function is a well-established and effective method for multi-objective Bayesian Optimization. It balances exploration (due to uncertainty) and exploitation (improving on the current Pareto front) by scalarizing the multi-objective problem into a series of single-objective problems. Averaging EI over multiple random weight vectors helps to cover different regions of the Pareto front. This method is computationally lighter than exact Expected Hypervolume Improvement (EHVI) calculations, especially for higher numbers of objectives, while still providing good performance. The approximation of the scalarized mean and standard deviation (using the maximum term\'s statistics) is a common heuristic to make the analytical EI formula tractable.\n3.  **Dynamic Objective Normalization**: This is a critical design choice to address the \"CRITICAL ROBUSTNESS REQUIREMENT\" regarding objective scales. By normalizing objectives to `[0, 1]` based on the current `ideal_point` (min observed) and `nadir_point` (max observed), the acquisition function becomes scale-invariant and robust to vastly different objective ranges or early pathological evaluations. This prevents the scalarization weights and EI calculations from being dominated by objectives with larger magnitudes.\n4.  **Incremental Pareto Archive Maintenance**: The chosen `_update_eval_points` strategy ensures that the total computational cost for maintaining the non-dominated archive over the entire budget is `O(budget^2 * n_obj)`. This is achieved by processing new points incrementally against the existing archive, rather than repeatedly re-computing the full non-dominated sort on the entire history of points (which would lead to `O(budget^3)` total complexity). This satisfies the requirement to avoid `O(budget^2)` operations *in the main loop* (meaning, per iteration, or total over the run).\n5.  **Sobol Sequence for Sampling**: Sobol sequences are a type of Quasi-Monte Carlo method that provides more uniform space-filling properties compared to pure random sampling. This is beneficial for both the initial design phase (to get a good spread of initial points) and for generating a diverse pool of candidates for acquisition function evaluation.\n6.  **Budget and Dimensionality Awareness**: The algorithm explicitly handles the `budget` and `dim` parameters, infers `n_obj` at runtime, and uses the provided `bounds` uniformly. This makes it highly generalizable without hardcoding assumptions about problem specifics.\n7.  **Lightweight and Modular Design**: The algorithm is broken down into clear, modular functions (`_sample_points`, `_fit_model`, `_acquisition_function`, `_select_next_points`, `_evaluate_points`, `_update_eval_points`), each with a specific, computationally lightweight task. This enhances readability, maintainability, and ensures that the internal overhead is minimal compared to objective function calls.\n\n# Code\n```python\nfrom collections.abc import Callable\nfrom scipy.stats import qmc\nfrom scipy.stats import norm\nimport numpy as np\nfrom sklearn.gaussian_process import GaussianProcessRegressor\nfrom sklearn.gaussian_process.kernels import RBF, ConstantKernel as C\nimport warnings\n\n# Suppress sklearn ConvergenceWarning for GPR to keep output clean\nwarnings.filterwarnings(\"ignore\", category=UserWarning, module=\"sklearn.gaussian_process\")\n\n\nclass MOBO_GP_TchebycheffEI:\n    \"""\n    Multi-Objective Bayesian Optimization (MOBO) algorithm using Gaussian Processes\n    and a Tchebycheff-based Expected Improvement (EI) acquisition function.\n    \"""\n\n    def __init__(self, budget: int, dim: int, bounds: np.ndarray | None = None):\n        \"""\n        Initializes the MOBO algorithm.\n\n        Args:\n            budget (int): The total number of function evaluations allowed.\n            dim (int): The dimensionality of the search space.\n            bounds (np.ndarray | None): A (2, dim) array specifying the lower and upper\n                                        bounds for each dimension. If None, defaults to [0, 1]^dim.\n        \"""\n        self.budget = budget\n        self.dim = dim\n        # bounds has shape (2, dim), bounds[0]: lower bound, bounds[1]: upper bound\n        if bounds is None:\n            self.bounds = np.array([[0.0] * dim, [1.0] * dim], dtype=float)\n        else:\n            self.bounds = np.asarray(bounds, dtype=float)\n\n        # The number of objectives (self.n_obj) is unknown a priori.\n        # It MUST be inferred on the first call to func inside _evaluate_points.\n        self.n_obj: int | None = None\n\n        # X has shape (n_points, n_dims), y has shape (n_points, n_obj)\n        self.X: np.ndarray | None = None  # Archive of evaluated design points\n        self.y: np.ndarray | None = None  # Archive of corresponding objective values\n        self.n_evals = 0  # The number of function evaluations performed\n\n        # Choose a reasonable number of initial evaluations.\n        # At least dim + 1 points are needed for GP fitting.\n        # Ensure it\'s not too large a fraction of the budget and at least 1 iteration remains.\n        self.n_init = max(self.dim + 1, 5)\n        self.n_init = min(self.n_init, self.budget - 1)\n\n        # Internal batch size for selecting points in each iteration after initial design.\n        self.batch_size = 1\n\n        # Limit for surrogate model training data to keep fitting computationally cheap.\n        self.max_train_size = 200\n\n        # List of Gaussian Process Regressors, one for each objective.\n        self.models: list[GaussianProcessRegressor] = []\n\n        # Ideal Point (minimum observed value for each objective) for dynamic normalization.\n        self.ideal_point: np.ndarray | None = None\n        # Nadir Point (maximum observed value for each objective) for dynamic normalization.\n        self.nadir_point: np.ndarray | None = None\n\n        # Number of candidate points to generate for acquisition function evaluation.\n        self.num_acquisition_candidates = max(100 * self.dim, 1000)\n        # Number of random weight vectors to use for Tchebycheff scalarization averaging.\n        self.num_weights = 100\n\n    def _sample_points(self, n_points: int) -> np.ndarray:\n        \"""\n        Samples n_points candidate points efficiently within self.bounds using Sobol sequence.\n\n        Args:\n            n_points (int): The number of points to sample.\n\n        Returns:\n            np.ndarray: An array of shape (n_points, self.dim) containing the sampled points.\n        \"""\n        sampler = qmc.Sobol(d=self.dim, scramble=True)\n        # Generate points in [0, 1]^dim\n        sample = sampler.random(n_points)\n        # Scale to self.bounds\n        lb, ub = self.bounds[0], self.bounds[1]\n        scaled_sample = lb + sample * (ub - lb)\n        return scaled_sample\n\n    def _fit_model(self, X_train: np.ndarray, y_train: np.ndarray):\n        \"""\n        Fits a Gaussian Process Regressor for each objective on the provided training data.\n        Uses a sliding window to limit the training set size.\n\n        Args:\n            X_train (np.ndarray): Training input data of shape (n_samples, self.dim).\n            y_train (np.ndarray): Training output data of shape (n_samples, self.n_obj).\n        """\n        # Use a sliding window to limit the number of training points\n        if len(X_train) > self.max_train_size:\n            X_train = X_train[-self.max_train_size:]\n            y_train = y_train[-self.max_train_size:]\n\n        self.models = []\n        # A robust kernel combining a ConstantKernel (for output scale) and RBF kernel.\n        # Bounds for length_scale are set to allow for broad optimization.\n        kernel = C(1.0, (1e-3, 1e3)) * RBF(length_scale=np.ones(self.dim), length_scale_bounds=(1e-5, 1e5))\n        for i in range(self.n_obj):\n            # Fit one GP per objective. alpha adds noise to the diagonal of the covariance matrix.\n            # n_restarts_optimizer helps find better hyperparameters. normalize_y=False as we handle it explicitly.\n            gp = GaussianProcessRegressor(kernel=kernel, alpha=1e-6, n_restarts_optimizer=10, normalize_y=False)\n            gp.fit(X_train, y_train[:, i])\n            self.models.append(gp)\n\n    def _predict(self, X: np.ndarray) -> tuple[np.ndarray, np.ndarray]:\n        """\n        Predicts the mean and standard deviation for each objective for given input points.\n\n        Args:\n            X (np.ndarray): Input points of shape (n_points, self.dim).\n\n        Returns:\n            tuple[np.ndarray, np.ndarray]: A tuple containing:\n                - mu (np.ndarray): Predicted means of shape (n_points, self.n_obj).\n                - sigma (np.ndarray): Predicted standard deviations of shape (n_points, self.n_obj).\n        """\n        mu_list = []\n        sigma_list = []\n        for gp in self.models:\n            mu, sigma = gp.predict(X, return_std=True)\n            mu_list.append(mu)\n            sigma_list.append(sigma)\n        return np.array(mu_list).T, np.array(sigma_list).T\n\n    def _acquisition_function(self, X_candidates: np.ndarray) -> np.ndarray:\n        """\n        Calculates the Tchebycheff-based Expected Improvement (EI) for a set of candidate points.\n        Objectives are dynamically normalized based on current ideal/nadir points.\n\n        Args:\n            X_candidates (np.ndarray): Candidate points of shape (n_candidates, self.dim).\n\n        Returns:\n            np.ndarray: A 1-D array of shape (n_candidates,) with acquisition scores.\n        """\n        if self.ideal_point is None or self.nadir_point is None:\n            # This should not happen after initial evaluations, but as a safeguard.\n            return np.zeros(len(X_candidates))\n\n        # Dynamically normalize current archive objectives to [0, 1]\n        range_y = self.nadir_point - self.ideal_point\n        range_y[range_y == 0] = 1e-9  # Add a small epsilon to avoid division by zero\n\n        y_norm_archive = (self.y - self.ideal_point) / range_y\n\n        # Predict mean and standard deviation for candidate points\n        mu_objs, sigma_objs = self._predict(X_candidates)\n\n        # Normalize predicted means and standard deviations\n        mu_objs_norm = (mu_objs - self.ideal_point) / range_y\n        sigma_objs_norm = sigma_objs / range_y\n\n        acquisition_values = np.zeros(len(X_candidates))\n\n        # Generate random weight vectors once for all candidates to improve efficiency\n        weights = np.random.dirichlet(np.ones(self.n_obj), size=self.num_weights)\n\n        # Calculate the best Tchebycheff value found so far for each weight vector\n        # This is min_{y_arch in archive} max_j(w_j * y_arch_j_norm)\n        # weights[:, None, :] broadcasts weights for each archive point\n        # y_norm_archive[None, :, :] broadcasts archive points for each weight\n        f_best_w_per_weight = np.min(np.max(weights[:, None, :] * y_norm_archive[None, :, :], axis=2), axis=1)\n\n        for i in range(len(X_candidates)):\n            # For each candidate, calculate its acquisition score by averaging over weight vectors\n            \n            # Approximate mean of the scalarized function for the candidate\n            # using the maximum term in the Tchebycheff function\n            weighted_mu_norm = weights * mu_objs_norm[i]  # (num_weights, n_obj)\n            scalarized_mu_per_weight = np.max(weighted_mu_norm, axis=1)  # (num_weights,)\n\n            # Find the index of the dominating objective for each weight vector\n            idx_max_per_weight = np.argmax(weighted_mu_norm, axis=1)  # (num_weights,)\n            \n            # Approximate standard deviation of the scalarized function by using the std\n            # of the dominating objective for each weight vector.\n            scalarized_sigma_per_weight = sigma_objs_norm[i, idx_max_per_weight]  # (num_weights,)\n\n            # Calculate Expected Improvement for each weight vector\n            # Handle cases with very small or zero standard deviation to prevent numerical issues.\n            zeros_sigma_mask = scalarized_sigma_per_weight < 1e-9\n            \n            Z = np.zeros_like(scalarized_sigma_per_weight)\n            # Compute Z for non-zero sigmas\n            Z[~zeros_sigma_mask] = (f_best_w_per_weight[~zeros_sigma_mask] - scalarized_mu_per_weight[~zeros_sigma_mask]) / scalarized_sigma_per_weight[~zeros_sigma_mask]\n            \n            ei_vals = np.zeros_like(scalarized_sigma_per_weight)\n            \n            # EI for zero sigma: only if predicted mean is better than f_best_w\n            ei_vals[zeros_sigma_mask] = np.maximum(0, f_best_w_per_weight[zeros_sigma_mask] - scalarized_mu_per_weight[zeros_sigma_mask])\n            # EI for non-zero sigma using the standard formula\n            ei_vals[~zeros_sigma_mask] = (f_best_w_per_weight[~zeros_sigma_mask] - scalarized_mu_per_weight[~zeros_sigma_mask]) * norm.cdf(Z[~zeros_sigma_mask]) + scalarized_sigma_per_weight[~zeros_sigma_mask] * norm.pdf(Z[~zeros_sigma_mask])\n            \n            acquisition_values[i] = np.mean(ei_vals) # Average EI over all weight vectors\n\n        return acquisition_values\n\n    def _select_next_points(self, batch_size: int) -> np.ndarray:\n        """\n        Selects the next batch of points to evaluate based on the acquisition function.\n\n        Args:\n            batch_size (int): The number of points to select.\n\n        Returns:\n            np.ndarray: An array of shape (batch_size, self.dim) with the selected points.\n        """\n        # Generate a pool of candidate points using QMC for diversity\n        candidate_pool = self._sample_points(self.num_acquisition_candidates)\n        # Evaluate acquisition function for all candidates\n        acquisition_scores = self._acquisition_function(candidate_pool)\n\n        # Select batch_size points with the highest acquisition values\n        best_indices = np.argsort(acquisition_scores)[::-1][:batch_size]\n        return candidate_pool[best_indices]\n\n    def _evaluate_points(self, func: Callable[[np.ndarray], np.ndarray], X_to_eval: np.ndarray) -> np.ndarray:\n        """\n        Evaluates the given points using the black-box function `func`.\n        This method is the only place where `func` is called.\n        It handles budget constraints and infers `self.n_obj` on the first call.\n\n        Args:\n            func (Callable[[np.ndarray], np.ndarray]): The black-box objective function.\n            X_to_eval (np.ndarray): Points to evaluate, shape (n_points, self.dim).\n\n        Returns:\n            np.ndarray: Evaluated objective values, shape (n_points, self.n_obj).\n        """\n        # Adjust X_to_eval to not exceed the total budget\n        if self.n_evals + len(X_to_eval) > self.budget:\n            X_to_eval = X_to_eval[:self.budget - self.n_evals]\n            if len(X_to_eval) == 0:\n                return np.array([])  # No points left to evaluate\n\n        # Clip points to self.bounds before calling func to respect the problem domain\n        lb, ub = self.bounds[0], self.bounds[1]\n        X_clipped = np.clip(X_to_eval, lb, ub)\n\n        new_y_values = []\n        for x_point in X_clipped:\n            y_val = func(x_point)\n            # Infer n_obj from the first evaluation\n            if self.n_obj is None:\n                self.n_obj = len(y_val)\n            elif len(y_val) != self.n_obj:\n                raise ValueError(f"Function returned {len(y_val)} objectives, but expected {self.n_obj}.")\n            new_y_values.append(y_val)\n        \n        self.n_evals += len(X_clipped) # Update total evaluations count\n        return np.array(new_y_values)\n\n    def _is_dominated(self, a: np.ndarray, b: np.ndarray) -> bool:\n        """\n        Checks if point \'a\' dominates point \'b\' for minimization.\n\n        Args:\n            a (np.ndarray): Objective vector of point \'a\'.\n            b (np.ndarray): Objective vector of point \'b\'.\n\n        Returns:\n            bool: True if \'a\' dominates \'b\', False otherwise.\n        """\n        # \'a\' dominates \'b\' if \'a\' is less than or equal to \'b\' in all objectives\n        # AND \'a\' is strictly less than \'b\' in at least one objective.\n        return np.all(a <= b) and np.any(a < b)\n\n    def _update_eval_points(self, new_X: np.ndarray, new_y: np.ndarray):\n        """\n        Updates the archive of evaluated points (self.X, self.y) with new evaluations.\n        Maintains only non-dominated points efficiently using an incremental strategy.\n        Also updates the ideal and nadir points.\n\n        Args:\n            new_X (np.ndarray): New design points evaluated, shape (n_new, self.dim).\n            new_y (np.ndarray): Corresponding new objective values, shape (n_new, self.n_obj).\n        """\n        if self.X is None:\n            # If archive is empty, initialize it with the new points\n            self.X = new_X\n            self.y = new_y\n        else:\n            # Convert to lists for easier manipulation during filtering\n            current_X_list = self.X.tolist()\n            current_y_list = self.y.tolist()\n            \n            new_X_filtered = []\n            new_y_filtered = []\n\n            # Step 1: Filter new_y points. Keep only those not dominated by the current archive.\n            # This is O(batch_size * N_archive * n_obj)\n            for i in range(len(new_X)):\n                is_dominated_by_archive = False\n                for existing_y_point in current_y_list:\n                    if self._is_dominated(np.array(existing_y_point), new_y[i]):\n                        is_dominated_by_archive = True\n                        break\n                if not is_dominated_by_archive:\n                    new_X_filtered.append(new_X[i])\n                    new_y_filtered.append(new_y[i])\n            \n            # If no new non-dominated points are found, just update ideal/nadir and return\n            if not new_y_filtered:\n                self.ideal_point = np.min(self.y, axis=0)\n                self.nadir_point = np.max(self.y, axis=0)\n                return\n\n            new_X_filtered_np = np.array(new_X_filtered)\n            new_y_filtered_np = np.array(new_y_filtered)\n\n            # Step 2: Filter current archive. Keep only points not dominated by the filtered new_y.\n            # This is O(N_archive * batch_size * n_obj)\n            archive_X_to_keep = []\n            archive_y_to_keep = []\n            for i in range(len(current_y_list)):\n                is_dominated_by_new = False\n                for filtered_new_y_point in new_y_filtered_np:\n                    if self._is_dominated(filtered_new_y_point, np.array(current_y_list[i])):\n                        is_dominated_by_new = True\n                        break\n                if not is_dominated_by_new:\n                    archive_X_to_keep.append(current_X_list[i])\n                    archive_y_to_keep.append(current_y_list[i])\n\n            # Step 3: Combine the filtered archive and filtered new points to form the new archive\n            self.X = np.vstack((np.array(archive_X_to_keep), new_X_filtered_np))\n            self.y = np.vstack((np.array(archive_y_to_keep), new_y_filtered_np))\n        \n        # Update ideal and nadir points from the current (updated) archive\n        self.ideal_point = np.min(self.y, axis=0)\n        self.nadir_point = np.max(self.y, axis=0)\n\n    def __call__(self, func: Callable[[np.ndarray], np.ndarray]) -> tuple[np.ndarray, np.ndarray]:\n        """\n        Executes the main multi-objective optimization loop.\n\n        Args:\n            func (Callable[[np.ndarray], np.ndarray]): The black-box objective function.\n\n        Returns:\n            tuple[np.ndarray, np.ndarray]: A tuple (F_pareto, X_pareto) where\n                                          F_pareto is the final non-dominated objective values\n                                          and X_pareto is the corresponding design points.\n        """\n        # Initial design phase: evaluate a set of initial points\n        initial_X = self._sample_points(self.n_init)\n        initial_y = self._evaluate_points(func, initial_X)\n        \n        # Handle cases where budget is too small for initial evaluations\n        if initial_y.size == 0:\n            return np.array([]), np.array([])\n        \n        self._update_eval_points(initial_X, initial_y)\n\n        # Main optimization loop: iterate until budget is exhausted\n        while self.n_evals < self.budget:\n            # 1. Fit or update the surrogate model using the current archive.\n            self._fit_model(self.X, self.y)\n\n            # 2. Use the acquisition function and _select_next_points to pick new candidates.\n            next_X_to_eval = self._select_next_points(self.batch_size)\n            \n            # If no points were selected (e.g., acquisition scores were all zero), or budget is too low\n            if len(next_X_to_eval) == 0:\n                break\n\n            # 3. Evaluate candidates with _evaluate_points, respecting the remaining budget.\n            new_y_values = self._evaluate_points(func, next_X_to_eval)\n            \n            # If budget ran out during evaluation (e.g., only part of batch was evaluated)\n            if new_y_values.size == 0:\n                break\n\n            # 4. Update the archive with _update_eval_points, keeping only non-dominated points.\n            self._update_eval_points(next_X_to_eval, new_y_values)\n\n        # Return the final non-dominated set (F_pareto, X_pareto)\n        # The _update_eval_points method ensures that self.y and self.X always contain\n        # the non-dominated points from all evaluations so far.\n        return self.y, self.X\n\n```"


